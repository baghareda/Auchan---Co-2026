<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./output.css" rel="stylesheet">
    <link rel="stylesheet" href="contact-us.html">
    <title>Auchan-clone</title>
</head>


<body class="bg-[#8ecae6]" style="min-height:100vh;display:flex;flex-direction:column">
    <nav class="nav-bar shrink-0">
        <div class="text-2xl flex justify-between bg-[#023047] text-[#ffb703] px-6 py-3 font-mono">

        <div  class="logo h-16 w-16 shrink-0"><img src="images/Logo_panier_stylisé_Ymarket-removebg-preview.png" 
            alt="logo"></div>
        <div class="seaarch-bar flex items-center bg-[#8ecae6] rounded-lg px-8 py-2">
            <input id="search" type="text"
            placeholder="type the product ..."
            class="text-gray-800 w-130">

            <button class="text[#023047]"></button>
        </div>
            <div class="buttons flex items-center gap-8">
                <a href="index.html" class="home">Acceuil</a>
                <a href="contact-us.html" class="contact">conatct-us</a>
                <button class="Add-Product">Add + </button>
            </div>
        </div>
    </nav>

    <div class="grid gap-6" style="flex:1;grid-template-columns:minmax(0,1fr) 450px">
        <div style="display:flex;flex-direction:column;min-width:0">

                <div class="categories-barer flex gap-8 m-8 justify-center">
                    <button onclick="showcategory('all')" class="bg-[#ffb703] text-[#023047] font-mono text-2xl rounded-lg px-8 py-2 cursor-pointer">All</button>
                    <button onclick="showcategory(fruits)" class="bg-[#ffb703] text-[#023047] font-mono text-2xl rounded-lg px-8 py-2 cursor-pointer">Fruits</button>
                    <button onclick="showcategory(legume)" class="bg-[#ffb703] text-[#023047] font-mono text-2xl rounded-lg px-8 py-2 cursor-pointer">legume</button>
                    <button onclick="showcategory(viande)" class="bg-[#ffb703] text-[#023047] font-mono text-2xl rounded-lg px-8 py-2 cursor-pointer">viande</button>
                </div>

            <section id="products-container" style="margin-top:auto;height:720px;grid-template-rows:repeat(2,1fr)" 
            class="cards grid grid-cols-4"></section>
            </section>
            <div style="margin-top:24px;margin-bottom: 16px;" class="pagination flex justify-center items-center gap-8 text-[#023047] bg-[#023047] border rounded-lg">

        <button id="prev" class="btn cursor-pointer transition
        hover:bg-[#ffb703] hover:text-white font-mono text-3xl text-[#ffb703]">Previous</button>

        <button id="current" class="first-page cursor-pointer transition text-white text-2xl ">-1-</button>

        <button  id="next" class="next-page cursor-pointer transition
        hover:bg-[#ffb703] hover:text-white font-mono text-3xl text-[#ffb703]">Next</button>
    </div>
        </div>

    <section class="drag-and-drop-panier flex justify-end">
        <div style="display:flex;flex-direction:column;height:105vh" class="top-of-dd w-[450px] rounded-lg shrink-0 overflow-hidden border">
            <h3 class="text-2xl text-right p-8 pr-12 bg-[#ffb703] 
            font-mono text-[#023047]">Choose or slide products</h3>

            <div id="cart" style="flex:1;min-height:0;overflow-y:auto" class="add-to-panier p-4 bg-white">

            <div id="card-items"></div>
            <div id="cart-total" class="font-mono text-2xl border-t pt-3 shrink-0">Total : 0 DH</div>

            </div>
        </div>
        
    </section>
    </div>
<script src="js/main.js"></script>
</body>
</html>
